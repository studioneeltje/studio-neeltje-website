backend:
  name: github
  repo: studioneeltje/studio-neeltje-website
  branch: main
  auth_methods: [token]
publish_mode: editorial_workflow
site_url: https://studioneeltje.github.io/studio-neeltje-website/
display_url: https://studioneeltje.github.io/studio-neeltje-website/
app_title: Studio Neeltje — inhoud & instellingen
media_folder: /media/originals
public_folder: /media/originals
media_libraries:
  default:
    config:
      max_file_size: 47185920
      slugify_filename: true
# Keep source files untouched. The publication workflow creates all web versions.
collections:
  - name: media
    label: Foto's & video's
    label_singular: Mediabestand
    folder: content/media
    extension: json
    format: json
    create: true
    identifier_field: id
    slug: '{{id}}'
    summary: '{{title}}'
    fields:
      - {name: id, label: Korte unieke naam, widget: string, pattern: ['^[a-z0-9][a-z0-9-]{0,100}$', 'Gebruik kleine letters, cijfers en streepjes.']}
      - {name: title, label: Titel, widget: string}
      - {name: kind, label: Soort, widget: select, options: [{label: Foto, value: image}, {label: Video, value: video}], default: image}
      - {name: source, label: Origineel bestand, widget: file}
      - {name: alt, label: Beschrijving voor toegankelijkheid, widget: text, required: false, default: ''}
      - {name: focus, label: Standaardfocus in de foto, widget: neeltje-focus, required: false}
      - {name: captions, label: Ondertiteling (VTT), widget: file, required: false}
      - {name: deletedAt, widget: hidden, required: false}
      - {name: dimensions, widget: hidden, required: false}
  - name: stories
    label: Trouwreportages
    label_singular: Trouwreportage
    folder: content/stories
    extension: json
    format: json
    create: true
    identifier_field: title
    slug: '{{id}}'
    preview_path: 'reportage-{{id}}.html'
    fields:
      - {name: id, label: Korte naam in de URL, widget: string, pattern: ['^[a-z0-9][a-z0-9-]{0,80}$', 'Gebruik kleine letters, cijfers en streepjes.']}
      - {name: title, label: Titel, widget: string}
      - {name: location, label: Locatie, widget: string}
      - {name: excerpt, label: Korte introductie, widget: text}
      - {name: body, label: Introductie van het verhaal, widget: markdown, required: false, hint: "Bestaande verhaaltekst blijft behouden. Voeg hieronder bij Verhaalonderdelen extra hoofdstukken en galerijen toe."}
      - {name: cover, label: Omslagfoto, widget: neeltje-image}
      - {name: hoverCover, label: Tweede foto bij aanwijzen, hint: "Kies een ander beeld uit deze reportage. Zonder keuze wordt de eerste andere galerijfoto gebruikt.", widget: neeltje-image, required: false}
      - name: gallery
        label: Foto's in de galerij
        widget: neeltje-image
        multiple: true
        required: false
        hint: Kies meerdere foto's op beeld en stel de volgorde in voordat je ze toevoegt.
      - {name: published, label: Tonen op de website, widget: boolean, default: true}
      - {name: couple, label: Namen van het bruidspaar, widget: string, required: false}
      - {name: seoTitle, label: Titel voor zoekmachines, widget: string, required: false}
      - {name: seoDescription, label: Omschrijving voor zoekmachines, widget: text, required: false}
      - name: sections
        label: Verhaalonderdelen — tekst en foto’s afwisselen
        widget: list
        required: false
        summary: '{{fields.key}} · {{fields.heading}} · {{fields.type}}'
        hint: Voeg zoveel onderdelen toe als je wilt. Sleep om te ordenen. Een galerij kan bijvoorbeeld 20 foto’s bevatten.
        fields:
          - {name: key, label: Unieke korte onderdeelnaam, widget: string, hint: 'Bijvoorbeeld voorbereidingen of ceremonie-galerij. Gebruik deze naam ook bij ordenen in Puck.', pattern: ['^[a-z0-9][a-z0-9-]{0,80}$', 'Kleine letters, cijfers en streepjes.']}
          - name: type
            label: Soort onderdeel
            widget: select
            default: text
            options:
              - {label: Verhaalhoofdstuk, value: text}
              - {label: Tekst naast een foto, value: textPhoto}
              - {label: Brede foto, value: photo}
              - {label: Twee foto’s, value: pair}
              - {label: Fotogalerij, value: gallery}
              - {label: Review, value: review}
          - {name: heading, label: Tussenkop, widget: string, required: false}
          - {name: body, label: Verhaaltekst, widget: markdown, required: false}
          - {name: image, label: Foto, widget: neeltje-image, required: false}
          - {name: secondImage, label: Tweede foto, widget: neeltje-image, required: false}
          - {name: caption, label: Bijschrift, widget: string, required: false}
          - {name: gallery, label: Galerijfoto’s — meerdere kiezen en ordenen, widget: neeltje-image, multiple: true, required: false}
          - {name: quote, label: Echte reviewtekst, widget: text, required: false}
          - {name: name, label: Naam bij de review, widget: string, required: false}
      - name: review
        label: Review van het bruidspaar (optioneel)
        widget: object
        required: false
        fields:
          - {name: quote, label: Reviewtekst, widget: text, required: false}
          - {name: name, label: Naam, widget: string, required: false}
          - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
      - {name: details, label: Over de locatie en deze bruiloft, widget: markdown, required: false}
      - name: suppliers
        label: Locatie en leveranciers
        widget: list
        required: false
        fields:
          - {name: role, label: Rol, widget: string, required: false}
          - {name: name, label: Naam, widget: string}
          - {name: url, label: Link, widget: string, required: false}
      - {name: contactTitle, label: Afsluitende uitnodiging, widget: string, required: false}
      - {name: contactLabel, label: Knoptekst, widget: string, required: false}
      - {name: contactUrl, label: Knoplink, widget: string, required: false}
      - {name: related, label: Gerelateerde gepubliceerde reportages, widget: relation, collection: stories, search_fields: [title, location], value_field: id, display_fields: [title], multiple: true, required: false}
  - name: articles
    label: Journal
    label_singular: Artikel
    folder: content/articles
    extension: json
    format: json
    create: true
    identifier_field: title
    slug: '{{id}}'
    # Concepten worden in de visuele preview bekeken, niet via een nog niet bestaande live URL.
    editor: {preview: true}
    fields:
      - {name: id, label: Korte naam in de URL, widget: string, pattern: ['^[a-z0-9][a-z0-9-]{0,80}$', 'Gebruik kleine letters, cijfers en streepjes.']}
      - {name: title, label: Titel, widget: string}
      - {name: seoTitle, label: Titel voor zoekmachines, widget: string, required: false, hint: 'Optionele SEO-titel. Laat leeg om de artikeltitel te gebruiken. De zichtbare titel in je blog verandert hierdoor niet.'}
      - {name: seoDescription, label: Omschrijving voor zoekmachines, widget: text, required: false, hint: 'Optionele meta-omschrijving voor dit artikel. Laat leeg om de introductie te gebruiken. De zichtbare introductie blijft hetzelfde.'}
      - {name: category, label: Onderwerp, widget: string}
      - {name: excerpt, label: Introductie, widget: text}
      - name: summary
        label: Voor de snelle lezer
        hint: Korte punten die de kern samenvatten. Zonder punten wordt de introductie gebruikt.
        widget: list
        required: false
        field: {name: point, label: Kernpunt, widget: string}
      - {name: author, label: Auteur, widget: string, default: Neeltje}
      - {name: date, label: Publicatiedatum, widget: datetime, date_format: 'DD-MM-YYYY', time_format: false, format: 'YYYY-MM-DD', required: false}
      - {name: updated, label: Bijgewerkt op, widget: datetime, date_format: 'DD-MM-YYYY', time_format: false, format: 'YYYY-MM-DD', required: false}
      - {name: showAuthor, label: Persoonlijk auteursblok tonen, widget: boolean, default: true}
      - {name: showToc, label: Inhoudsopgave bij minimaal drie tussenkoppen, widget: boolean, default: true}
      - {name: body, label: Artikeltekst, widget: markdown, required: false, hint: Gebruik kop 2 of kop 3 voor de inhoudsopgave. Voeg hieronder afwisselende blokken toe. De leestijd wordt automatisch berekend.}
      - {name: cover, label: Headerfoto (optioneel), widget: neeltje-image, required: false}
      - {name: coverCaption, label: Bijschrift headerfoto, widget: string, required: false}
      - name: sections
        label: Artikelblokken
        hint: Versleep de blokken om tekst, tips en foto's af te wisselen. Foto's zijn optioneel.
        widget: list
        required: false
        types:
          - name: text
            label: Tekst
            widget: object
            fields:
              - {name: title, label: Tussenkop, widget: string, required: false}
              - {name: text, label: Tekst, widget: markdown}
          - name: photo
            label: Eén foto
            widget: object
            fields:
              - {name: image, label: Foto, widget: neeltje-image}
              - {name: width, label: Breedte, widget: select, options: [{label: Tekstbreedte, value: copy}, {label: Breed, value: wide}], default: copy}
              - {name: caption, label: Bijschrift, widget: string, required: false}
          - name: pair
            label: Twee foto's naast elkaar
            widget: object
            fields:
              - {name: image, label: Eerste foto, widget: neeltje-image}
              - {name: secondImage, label: Tweede foto, widget: neeltje-image}
              - {name: caption, label: Bijschrift, widget: string, required: false}
          - name: split
            label: Foto naast tekst
            widget: object
            fields:
              - {name: title, label: Tussenkop, widget: string, required: false}
              - {name: text, label: Tekst, widget: markdown}
              - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
              - {name: caption, label: Bijschrift, widget: string, required: false}
          - name: tip
            label: Praktische tip
            widget: object
            fields:
              - {name: title, label: Titel, widget: string}
              - {name: text, label: Tip, widget: markdown}
          - name: checklist
            label: Checklist
            widget: object
            fields:
              - {name: title, label: Titel, widget: string}
              - name: items
                label: Punten
                widget: list
                field: {name: item, label: Punt, widget: string}
      - name: related
        label: Gerelateerde artikelen
        hint: Laat leeg voor maximaal drie automatische leestips met voorkeur voor hetzelfde onderwerp.
        widget: relation
        collection: articles
        search_fields: [title]
        value_field: id
        display_fields: [title]
        multiple: true
        required: false
      - name: cta
        label: Uitnodiging onder het artikel
        widget: object
        required: false
        fields:
          - {name: enabled, label: Uitnodiging tonen, widget: boolean, default: true}
          - {name: title, label: Titel, widget: string, default: 'Meer rust in jullie planning?', required: false}
          - {name: text, label: Toelichting, widget: text, default: 'De gratis trouwchecklist helpt jullie stap voor stap op weg.', required: false}
          - {name: label, label: Knoptekst, widget: string, default: 'Ontdek de gratis trouwchecklist', required: false}
          - {name: href, label: Link, widget: string, default: weddingschecklist.html, required: false, hint: Alleen met knoptekst én link verschijnt de uitnodiging.}
      - {name: published, label: Tonen op de website, widget: boolean, default: true}
  - name: settings
    label: Algemene instellingen
    files:
      - name: site
        label: Huisstijl, menu & footer
        file: content/settings/site.json
        fields:
          - {name: title, label: Naam van de website, widget: string}
          - {name: email, label: E-mailadres, widget: string, required: false}
          - {name: phone, label: Telefoonnummer, widget: string, required: false}
          - {name: instagram, label: Instagram-link, widget: string, required: false}
          - name: colors
            label: Huisstijlkleuren
            widget: object
            fields:
              - {name: wine, label: Donkerrood, widget: color}
              - {name: pink, label: Lichtroze, widget: color}
              - {name: blue, label: Lichtblauw, widget: color}
              - {name: orange, label: Oranje, widget: color}
          - name: navigation
            label: Hoofdmenu
            widget: list
            summary: '{{label}}'
            fields:
              - {name: label, label: Tekst, widget: string}
              - {name: href, label: Link, widget: string}
              - {name: kind, label: Vorm, widget: select, options: [{label: Menulink, value: link}, {label: Oranje knop, value: checklist}, {label: Donkerrode knop, value: contact}]}
          - name: aboutPhotoNote
            label: Fotolabel bij Over Neeltje
            widget: object
            hint: Geldt voor het blok met de kop Wat er echt gebeurt, op alle pagina's waarop dit blok staat.
            fields:
              - {name: enabled, label: Fotolabel tonen, widget: boolean, default: true}
              - {name: text, label: Tekst op het roze label, widget: string, required: false}
              - name: position
                label: Plaatsing
                widget: select
                default: inside
                options:
                  - {label: "Op de foto, linksonder", value: inside}
                  - {label: Onder de foto, value: below}
          - name: footer
            label: Nieuwsbriefuitnodiging onderaan
            widget: object
            fields:
              - {name: title, label: Titel eerste regel, widget: string}
              - {name: emphasis, label: Schuine titelregel, widget: string}
              - {name: copy, label: Toelichting, widget: text}
              - {name: button, label: Knoptekst, widget: string}
      - name: contactPage
        label: Contactpagina met glitter
        file: content/settings/contact.json
        fields:
          - name: hero
            label: Header · foto, GIF of video
            widget: object
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel (regeleinde toegestaan), widget: text, required: false}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, required: false}
              - {name: body, label: Korte tekst, widget: text, required: false}
              - {name: button, label: Knop naar het formulier, widget: string, required: false}
              - {name: image, label: Foto of stil posterbeeld, widget: neeltje-image, required: false}
              - {name: mode, label: Soort headerbeeld, widget: select, default: image, options: [{label: Foto, value: image}, {label: Bewegende GIF, value: gif}, {label: Stille video, value: video}]}
              - {name: gif, label: GIF uit de beeldbank, widget: neeltje-image, required: false}
              - {name: videoId, label: Video uit de beeldbank, widget: relation, collection: media, search_fields: [title], value_field: id, display_fields: [title], required: false, hint: Kies een mediabestand van het soort Video. Uploaden en publiceren kan via Puck → Media.}
              - {name: photoLabel, label: Fotolabel, widget: string, required: false}
              - {name: photoCaption, label: Ondertitel fotolabel, widget: string, required: false}
              - {name: glitter, label: Zichtbare glitteraccenten, widget: boolean, required: false}
          - name: form
            label: Formulier, review en vervolgstappen
            widget: object
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel, widget: string, required: false}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, required: false}
              - {name: intro, label: Introductie formulier, widget: text, required: false}
              - {name: sideTitle, label: Sierlijke tekst naast het formulier, widget: text, required: false}
              - {name: sideText, label: Tekst naast het formulier, widget: text, required: false}
              - {name: signature, label: Ondertekening, widget: string, required: false}
              - {name: namesLabel, label: Label namen, widget: string, required: false}
              - {name: emailLabel, label: Label e-mailadres, widget: string, required: false}
              - {name: dateLabel, label: Label optionele trouwdatum, widget: string, required: false}
              - {name: locationLabel, label: Label optionele locatie, widget: string, required: false}
              - {name: messageLabel, label: Label bericht, widget: string, required: false}
              - {name: button, label: Verzendknop, widget: string, required: false}
              - {name: reassurance, label: Tekst onder de knop, widget: string, required: false}
              - {name: reviewId, label: Korte naam van de review (leeg = geen review), widget: string, required: false}
              - {name: stepsTitle, label: Titel vervolgstappen, widget: string, required: false}
              - {name: stepsEmphasis, label: Sierlijke tekst bij vervolgstappen, widget: string, required: false}
              - name: steps
                label: Drie vervolgstappen
                widget: list
                min: 3
                max: 3
                summary: "{{fields.title}}"
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: text, label: Toelichting, widget: text}
          - name: personal
            label: Achter de camera · Ook gewoon Neeltje
            widget: object
            fields:
              - {name: title, label: Titel, widget: string, required: false}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, required: false}
              - {name: intro, label: Korte introductie, widget: text, required: false}
              - {name: glitter, label: Glitteraccenten, widget: boolean, required: false}
              - name: cards
                label: Drie losse kaarten
                widget: list
                min: 3
                max: 3
                summary: "{{fields.caption}}"
                hint: Met een foto wordt een fotoprint getoond; zonder foto verschijnt de grafische tekstkaart.
                fields:
                  - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
                  - {name: caption, label: Bijschrift, widget: string}
                  - {name: title, label: Tekstkaart titel (zonder foto), widget: string, required: false}
                  - {name: emphasis, label: Sierlijke tekst (zonder foto), widget: string, required: false}
      - name: editorial
        label: Informatiekaarten & reviews
        file: content/settings/editorial.json
        fields:
          - name: personalInvite
            label: Persoonlijke contactuitnodiging
            widget: object
            required: false
            hint: Voor de persoonlijke contactuitnodiging in Puck en de afsluiting van portfolioverhalen. Alleen tekst én link samen tonen een knop.
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel, widget: string, required: false}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, required: false}
              - {name: body, label: Korte tekst, widget: text, required: false}
              - {name: button, label: Knoptekst (optioneel), widget: string, required: false}
              - {name: href, label: Knoplink (optioneel), widget: string, required: false}
              - {name: reassurance, label: Geruststelling onder de knop, widget: string, required: false}
              - {name: image, label: Portret van Neeltje, widget: neeltje-image, required: false}
              - {name: photoLabel, label: Naam op het fotolabel, widget: string, required: false}
              - {name: photoCaption, label: Ondertitel op het fotolabel, widget: string, required: false}
              - {name: quote, label: Echte korte review (optioneel), widget: text, required: false}
              - {name: name, label: Naam bij de review, widget: string, required: false}
              - {name: investmentLabel, label: Knoptekst investering (optioneel), widget: string, required: false}
              - {name: investmentUrl, label: Link naar investering (optioneel), widget: string, required: false}
              - {name: investmentNote, label: Korte toelichting investering (optioneel), widget: string, required: false}
              - {name: aboutLabel, label: Linktekst bij portret (optioneel), widget: string, required: false}
              - {name: aboutUrl, label: Link naar Over mij (optioneel), widget: string, required: false}
          - name: portfolioCards
            label: Kop boven informatiekaarten op portfolio’s
            hint: Deze kop en de twee informatiekaarten hieronder worden automatisch op alle portfolio-projectpagina’s gebruikt, zoals op Bordeaux, Frankrijk.
            widget: object
            required: false
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false, default: DIT WIL IK}
              - {name: title, label: Titel, widget: string, default: Ontdek jouw}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, default: mogelijkheden.}
              - {name: background, label: Achtergrond, widget: select, default: white, options: [{label: Wit, value: white}, {label: Blauw, value: blue}, {label: Roze, value: pink}, {label: Donkerrood, value: wine}]}
          - name: cards
            label: Volop beleven, mooi bewaren
            widget: list
            min: 2
            max: 2
            summary: '{{title}}'
            fields:
              - {name: label, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel, widget: string}
              - {name: emphasis, label: Sierlijke titelregel, widget: string, required: false}
              - {name: text, label: Tekst, widget: text, required: false}
              - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
              - name: tags
                label: Korte kenmerken (optioneel)
                widget: list
                required: false
                field: {name: tag, label: Kenmerk, widget: string}
              - {name: button, label: Knoptekst (optioneel), widget: string, required: false}
              - {name: href, label: Knoplink (optioneel), widget: string, required: false, hint: Alleen als tekst én link ingevuld zijn wordt de knop zichtbaar.}
          - name: reviews
            label: Reviews voor kaarten en losse quote
            hint: Kies deze reviews in Puck voor kaarten of de grote losse quote. Geef iedere review een unieke korte naam. Laat Vervolg van een andere review leeg bij een zelfstandig bruidspaar.
            widget: list
            min: 2
            summary: '{{name}} — {{caption}}'
            fields:
              - {name: id, label: Korte naam van de review, widget: string, hint: 'Bijvoorbeeld jeroen-martine. Houd deze naam gelijk nadat je de review op een pagina hebt gekozen.', pattern: ['^[a-z0-9][a-z0-9-]{0,80}$', 'Gebruik kleine letters, cijfers en streepjes.']}
              - {name: quote, label: Quote, widget: text}
              - {name: fullText, label: Volledige review (optioneel uitklapbaar), widget: text, required: false, hint: Alleen voor de grote losse quote. Zonder tekst of gekoppeld vervolg verschijnt geen uitklapknop.}
              - {name: continuationOf, label: Vervolg van een andere review (meestal leeg), widget: string, default: '', required: false, hint: 'Alleen invullen als dit echt een tweede fragment van dezelfde review is. Gebruik de korte naam van de eerste review; laat dit leeg bij een ander bruidspaar.'}
              - {name: name, label: Naam (sierlijk lettertype), widget: string}
              - {name: caption, label: Onderschrift, widget: string, required: false}
              - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
              - {name: visible, label: Tonen, widget: boolean, default: true}
      - name: checklist
        label: 'Trouwchecklist: verkoopblokken'
        file: content/settings/checklist.json
        fields:
          - name: contents
            label: Papier & overzicht
            widget: object
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel, widget: string}
              - {name: emphasis, label: Sierlijke titelregel, widget: string}
              - {name: intro, label: Introductie, widget: text}
              - name: benefits
                label: Voordelen
                hint: Gebruik 3, 5 of 7 voordelen. Een even aantal wordt bij publicatie afgekeurd.
                widget: list
                min: 3
                max: 7
                summary: '{{title}}'
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: text, label: Toelichting, widget: text}
              - {name: cover, label: Coverfoto (optioneel), widget: neeltje-image, required: false}
              - {name: coverLabel, label: Label op de cover, widget: string, required: false}
              - {name: coverTitle, label: Cover titel, widget: string}
              - {name: coverEmphasis, label: Cover sierlijke regel, widget: string}
              - {name: coverFooter, label: Cover onderregel, widget: string, required: false}
              - {name: button, label: Knoptekst (optioneel), widget: string, required: false}
              - {name: href, label: Knoplink (optioneel), widget: string, required: false, hint: '#checklist-aanvragen verwijst naar het aparte checklistformulier. Zonder tekst of link wordt de knop verborgen.'}
              - {name: note, label: Korte tekst onder de knop, widget: string, required: false}
          - name: audience
            label: Voor wie is deze trouwchecklist?
            hint: Beide stijlen gebruiken deze inhoud. De vormgeving kies je per blok in Puck.
            widget: object
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string, required: false}
              - {name: title, label: Titel persoonlijk & herkenbaar, widget: string}
              - {name: emphasis, label: Sierlijke regel persoonlijk & herkenbaar, widget: string}
              - {name: editorialTitle, label: Titel rustig & redactioneel, widget: string}
              - {name: editorialEmphasis, label: Sierlijke regel rustig & redactioneel, widget: string}
              - {name: intro, label: Introductie, widget: text}
              - {name: asideTitle, label: Persoonlijke zijtekst titel, widget: string, required: false}
              - {name: asideText, label: Persoonlijke zijtekst, widget: text, required: false}
              - {name: footer, label: Redactionele onderregel, widget: string, required: false}
              - name: points
                label: Herkenningspunten
                hint: Gebruik 3, 5 of 7 punten. De lange en korte titel horen bij hetzelfde punt; toelichting wordt gedeeld.
                widget: list
                min: 3
                max: 7
                summary: '{{title}}'
                fields:
                  - {name: title, label: Persoonlijke titel, widget: string}
                  - {name: shortTitle, label: Korte redactionele titel, widget: string}
                  - {name: text, label: Toelichting, widget: text}
      - name: experience
        label: Stappen, auteur & bevestigingen
        file: content/settings/experience.json
        fields:
          - name: journey
            label: Compacte stappenbalk
            widget: object
            fields:
              - {name: eyebrow, label: Bovenregel, widget: string}
              - {name: title, label: Titel, widget: string}
              - {name: emphasis, label: Sierlijke titelregel, widget: string}
              - {name: button, label: Knoptekst (optioneel), widget: string, required: false}
              - {name: href, label: Knoplink (optioneel), widget: string, required: false}
              - name: steps
                label: Stappen
                widget: list
                min: 3
                max: 3
                summary: '{{title}}'
                fields:
                  - {name: phase, label: Fase, widget: string}
                  - {name: title, label: Titel, widget: string}
                  - {name: text, label: Toelichting, widget: text}
          - name: author
            label: Persoonlijk auteursblok onder blogs
            widget: object
            fields:
              - {name: enabled, label: Auteursblok tonen, widget: boolean, default: true}
              - {name: eyebrow, label: Bovenregel, widget: string}
              - {name: title, label: Aanhef, widget: string}
              - {name: name, label: Naam, widget: string}
              - {name: bio, label: Persoonlijke introductie, widget: text}
              - {name: image, label: Foto (optioneel), widget: neeltje-image, required: false}
              - {name: button, label: Linktekst (optioneel), widget: string, required: false}
              - {name: href, label: Link (optioneel), widget: string, required: false}
          - name: thanks
            label: Bevestigingsteksten na geslaagde verzending
            hint: Verzending is nog niet aangesloten. Deze teksten worden pas als bevestiging getoond na een geslaagde verzending, of als duidelijk gemarkeerd voorbeeld in Puck.
            widget: object
            fields:
              - name: contact
                label: Contactaanvraag
                widget: object
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: emphasis, label: Sierlijke titelregel, widget: string}
                  - {name: copy, label: Bericht, widget: text}
                  - {name: nextTitle, label: Volgende stap titel, widget: string}
                  - {name: nextCopy, label: Volgende stap tekst, widget: text}
              - name: availability
                label: Datumaanvraag
                widget: object
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: emphasis, label: Sierlijke titelregel, widget: string}
                  - {name: copy, label: Bericht, widget: text}
                  - {name: nextTitle, label: Volgende stap titel, widget: string}
                  - {name: nextCopy, label: Volgende stap tekst, widget: text}
              - name: newsletter
                label: Nieuwsbrief
                widget: object
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: emphasis, label: Sierlijke titelregel, widget: string}
                  - {name: copy, label: Bericht, widget: text}
                  - {name: nextTitle, label: Volgende stap titel, widget: string}
                  - {name: nextCopy, label: Volgende stap tekst, widget: text}
              - name: checklist
                label: Trouwchecklist
                widget: object
                fields:
                  - {name: title, label: Titel, widget: string}
                  - {name: emphasis, label: Sierlijke titelregel, widget: string}
                  - {name: copy, label: Bericht, widget: text}
                  - {name: nextTitle, label: Volgende stap titel, widget: string}
                  - {name: nextCopy, label: Volgende stap tekst, widget: text}
      - name: forms
        label: Formulierkoppelingen (nog uitgeschakeld)
        file: content/settings/forms.json
        fields:
          - {name: recipient, label: E-mailadres voor contact- en datumaanvragen, widget: string}
          - name: contact
            label: Contact en datumaanvragen
            hint: Verzending is op verzoek uitgesteld. Alleen activeren nadat een echte verwerkingsdienst is aangesloten. Geen geheime sleutels invullen.
            widget: object
            fields:
              - {name: provider, label: Verwerking, widget: select, options: [{label: Nog niet aangesloten, value: none}, {label: Eigen openbaar JSON-formulierendpoint, value: json}], default: none}
              - {name: endpoint, label: Openbaar HTTPS-endpoint, widget: string, required: false}
              - {name: activated, label: Verwerking is aangesloten en klaar, widget: boolean, default: false}
          - name: newsletter
            label: Nieuwsbrief
            widget: object
            fields:
              - {name: provider, label: Verwerking, widget: select, options: [{label: Nog niet aangesloten, value: none}, {label: Eigen openbaar JSON-formulierendpoint, value: json}], default: none}
              - {name: endpoint, label: Openbaar HTTPS-endpoint, widget: string, required: false}
              - {name: activated, label: Verwerking is aangesloten en klaar, widget: boolean, default: false}
          - name: checklist
            label: Checklistaanvraag
            widget: object
            fields:
              - {name: provider, label: Verwerking, widget: select, options: [{label: Nog niet aangesloten, value: none}, {label: Eigen openbaar JSON-formulierendpoint, value: json}], default: none}
              - {name: endpoint, label: Openbaar HTTPS-endpoint, widget: string, required: false}
              - {name: activated, label: Verwerking is aangesloten en klaar, widget: boolean, default: false}
          - {name: checklistFile, label: Checklistbestand (optioneel), widget: file, required: false}
          - {name: checklistNewsletterText, label: Tekst bij verplichte nieuwsbriefkeuze voor de checklist, widget: text, default: 'Ik wil de gratis trouwchecklist én nieuwsbrieven van Studio Neeltje ontvangen. Ik kan me op ieder moment uitschrijven.', hint: 'De keuze staat nooit vooraf aan. Benoem zowel de nieuwsbrief als de mogelijkheid om uit te schrijven.'}
          - {name: privacyURL, label: Link naar privacy-informatie (optioneel), widget: string, required: false}
      - name: media
        label: Beeldkwaliteit & verwerking
        file: content/settings/media.json
        fields:
          - name: imageWidths
            label: Fotobreedtes in pixels
            widget: list
            field: {name: width, widget: number, value_type: int, min: 100, max: 4096}
          - {name: webpQuality, label: WebP-kwaliteit, widget: number, value_type: int, min: 1, max: 100}
          - {name: avifQuality, label: AVIF-kwaliteit, widget: number, value_type: int, min: 1, max: 100}
          - name: videoWidths
            label: Videobreedtes in pixels
            widget: list
            field: {name: width, widget: number, value_type: int, min: 100, max: 1920}
          - {name: videoCRF, label: Videocompressie (lager is hogere kwaliteit), widget: number, value_type: int, min: 16, max: 35}
          - {name: maxVideoMinutes, label: Maximale videolengte in minuten, widget: number, value_type: int, min: 1, max: 30}
          - {name: maxUploadMB, label: Maximale bronbestandsgrootte in MB, widget: number, value_type: int, min: 1, max: 90}
