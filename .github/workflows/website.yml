name: Website en media
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Controle en beeldverwerking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/processed
          key: media-${{ runner.os }}-${{ hashFiles('media/originals/**', 'content/settings/media.json', 'scripts/process-media.mjs') }}
          restore-keys: |
            media-${{ runner.os }}-
      - run: pnpm build
      - name: Voorvertoning als downloadbare website bewaren
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-voorvertoning
          path: dist
          retention-days: 7
      - name: Publicatiepakket bewaren
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Testsite publiceren
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren na geslaagde controle
        id: deployment
        uses: actions/deploy-pages@v4
